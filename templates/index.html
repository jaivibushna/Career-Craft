<!DOCTYPE html>
<html>
<head>

    <title>Professional Resume Builder</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Professional Resume Builder</h1>

    <form action="/preview"
          method="POST"
          enctype="multipart/form-data">

        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Phone Number</label>
        <input type="text" name="phone" required>

        <label>GitHub Profile</label>
        <input type="text" name="github">

        <label>LinkedIn Profile</label>
        <input type="text" name="linkedin">

        <label>Select Resume Template</label>

<select name="template">

    <option value="professional">
        Professional
    </option>

    <option value="modern">
        Modern
    </option>

    <option value="creative">
        Creative
    </option>

</select>

        <label>Choose Resume Template</label>
        <select name="template">
            <option value="modern">Modern Blue</option>
            <option value="professional">Professional Black</option>
            <option value="creative">Creative Green</option>
        </select>

        <label>Profile Photo</label>
        <input type="file" name="photo" accept="image/*">

        <label>Professional Summary</label>
        <textarea name="summary" rows="4"></textarea>

        <label>Skills</label>
        <textarea name="skills" rows="4"></textarea>

        <label>Education</label>
        <textarea name="education" rows="4"></textarea>

        <label>Projects</label>
        <textarea name="projects" rows="4"></textarea>

        <label>Experience</label>
        <textarea name="experience" rows="4"></textarea>

        <label>Certifications</label>
        <textarea name="certifications" rows="4"></textarea>

        <button type="submit">
            Generate Resume
        </button>

    </form>

</div>

</body>
</html>
