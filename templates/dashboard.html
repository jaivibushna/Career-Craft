<!DOCTYPE html>
<html>
<head>

    <title>Dashboard</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Welcome {{ username }}</h1>

    <hr>

    <h2>Total Resumes Created</h2>

    <h3>{{ total_resumes }}</h3>

    <hr>

    <h2>Recent Resumes</h2>

    <ul>

        {% for resume in recent_resumes %}

            <li>{{ resume[0] }}</li>

        {% endfor %}

    </ul>

    <hr>

    <a href="/">
        <button>Create Resume</button>
    </a>

    <br><br>

    <a href="/saved_resumes">
        <button>My Saved Resumes</button>
    </a>

    <br><br>

    <a href="/logout">
        <button>Logout</button>
    </a>

</div>

</body>
</html>
